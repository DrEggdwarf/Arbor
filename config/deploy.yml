service: arbor
image: dreggdwarf/arbor

servers:
  web:
    hosts:
      - 217.69.13.112

proxy:
  ssl: true
  host: arbor.robin-borg.dev

registry:
  server: ghcr.io
  username: DrEggdwarf
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE

# Réutilise le volume existant (SQLite de prod) — ne pas repartir sur une base vide.
volumes:
  - "arbor-storage:/rails/storage"

# SSH sur 2022 (22 = honeypot Cowrie).
ssh:
  port: 2022

# Build local sur le runner GitHub Actions (amd64).
builder:
  arch: amd64
